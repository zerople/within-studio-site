<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Within Studio · TikTok authorization complete</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;line-height:1.5;color:#1c1c1c}code{display:block;background:#f3f3f3;padding:12px;border-radius:8px;word-break:break-all;margin:12px 0;font-size:13px}a.btn{display:inline-block;background:#111;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;margin-top:8px}.dim{color:#666;font-size:14px}</style></head>
<body><h1>TikTok authorization complete</h1><p>TikTok has sent an authorization code back to Within Studio. Return to the desk to finish connecting the account.</p>
<p><a id="back" class="btn" href="#">Return to Within Studio desk →</a></p>
<p class="dim">Authorization code (if you need to paste it manually):</p><code id="c">…</code><p id="e"></p>
<script>const q=new URLSearchParams(location.search);const code=q.get('code');document.getElementById('c').textContent=code||location.href;
if(q.get('error'))document.getElementById('e').textContent='Error: '+q.get('error')+' '+(q.get('error_description')||'');
const desk=localStorage.getItem('deskOrigin')||'http://localhost:5174';
document.getElementById('back').href=desk+'/connect/tiktok/callback?'+q.toString();</script></body></html>
